<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Light Advisor - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/Logo.jpeg') }}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-gray-800 to-gray-600 text-white min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center py-10">
            <img src="{{ url_for('static', filename='img/Logo.jpeg') }}" alt="Inner Light Advisor Logo" class="mx-auto mb-4 w-32 rounded-full shadow-md">
            <h1 class="text-3xl md:text-4xl font-extrabold uppercase tracking-tight text-white drop-shadow-md">Admin Dashboard</h1>
            <p class="text-lg md:text-xl text-gray-200 mt-2 font-light">Manage Your Platform</p>
        </header>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white text-gray-900 rounded-2xl shadow-xl p-6 transform hover:scale-105 transition duration-300">
                <h2 class="text-xl font-semibold text-indigo-900 mb-4">Total Users</h2>
                <p class="text-3xl font-bold text-gray-800">{{ total_users }}</p>
            </div>
            <div class="bg-white text-gray-900 rounded-2xl shadow-xl p-6 transform hover:scale-105 transition duration-300">
                <h2 class="text-xl font-semibold text-indigo-900 mb-4">Students</h2>
                <p class="text-3xl font-bold text-gray-800">{{ total_students }}</p>
            </div>
            <div class="bg-white text-gray-900 rounded-2xl shadow-xl p-6 transform hover:scale-105 transition duration-300">
                <h2 class="text-xl font-semibold text-indigo-900 mb-4">Teachers</h2>
                <p class="text-3xl font-bold text-gray-800">{{ total_teachers }}</p>
            </div>
            <div class="bg-white text-gray-900 rounded-2xl shadow-xl p-6 transform hover:scale-105 transition duration-300">
                <h2 class="text-xl font-semibold text-indigo-900 mb-4">Courses</h2>
                <p class="text-3xl font-bold text-gray-800">{{ total_courses }}</p>
                <a href="{{ url_for('admin_courses') }}" class="mt-4 inline-block text-indigo-600 hover:underline">Manage Courses</a>
            </div>
            <div class="bg-white text-gray-900 rounded-2xl shadow-xl p-6 transform hover:scale-105 transition duration-300">
                <h2 class="text-xl font-semibold text-indigo-900 mb-4">Tasks</h2>
                <p class="text-3xl font-bold text-gray-800">{{ total_tasks }}</p>
                <a href="{{ url_for('admin_tasks') }}" class="mt-4 inline-block text-indigo-600 hover:underline">Manage Tasks</a>
            </div>
        </section>

        <div class="text-center mt-8">
            <a href="{{ url_for('admin_users') }}" class="inline-block py-3 px-6 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition duration-200">Manage Users</a>
            <a href="{{ url_for('logout') }}" class="ml-4 inline-block py-3 px-6 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition duration-200">Logout</a>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-8">
        <div class="container mx-auto px-4">
            <p class="text-center text-sm">© 2025 Inner Light Advisor. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
